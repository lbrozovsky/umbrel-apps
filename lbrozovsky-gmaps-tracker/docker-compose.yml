version: "3.7"

services:
  # Umbrel: přesměruje port aplikace a přidá před web přihlášení Umbrelu
  app_proxy:
    environment:
      APP_HOST: lbrozovsky-gmaps-tracker_web_1
      APP_PORT: 8000

  # webový prohlížeč tras
  web:
    image: ghcr.io/lbrozovsky/gmaps-tracker:1.9.6
    user: "1000:1000"
    restart: on-failure
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--no-reload"]
    environment:
      TZ: Europe/Prague
    volumes:
      - ${APP_DATA_DIR}/data:/data

  # smyčka stahující polohy (cookies.txt a locations.sqlite v data/)
  fetcher:
    image: ghcr.io/lbrozovsky/gmaps-tracker:1.9.6
    user: "1000:1000"
    restart: on-failure
    command: ["run", "--authuser", "0"]
    environment:
      TZ: Europe/Prague
      GMT_ME: "Lukáš Brožovský"
    volumes:
      - ${APP_DATA_DIR}/data:/data
