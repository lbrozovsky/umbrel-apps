manifestVersion: 1
id: lbrozovsky-gmaps-tracker
category: automation
name: GMaps Tracker
version: "1.10.2"
tagline: Historie poloh ze Sdílení polohy v Google Maps
icon: https://raw.githubusercontent.com/lbrozovsky/umbrel-apps/main/lbrozovsky-gmaps-tracker/icon.svg
description: >-
  Periodicky stahuje polohy lidí, kteří s vámi sdílejí polohu v Google Maps,
  ukládá je do SQLite a zobrazuje trasy na mapě včetně detekce pobytů,
  typu přesunů a heatmapy.


  Po instalaci nahrajte aplikací Files do složky aplikace, podsložky data,
  soubor cookies.txt exportovaný z Firefoxu (postup v README projektu).
  Nepouštějte současně jinou instanci se stejnými cookies.
releaseNotes: >-
  Přesnější typy přesunů: krátká cesta autem se už nerozpadá na chůzi
  a auto, přestup z vlaku na metro zůstane vlakem a metrem, jízda městem
  není kolo a stání doma před odjezdem patří k pobytu.
